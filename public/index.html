<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Weeve — Local stub</title>
    <style>
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
      .card{max-width:680px;padding:24px;border-radius:12px;border:1px solid #eee;text-align:center}
      a.button{display:inline-block;margin-top:12px;padding:10px 16px;border-radius:8px;background:#0ea5e9;color:#fff;text-decoration:none}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Weeve</h1>
      <p>This is a local fallback page for the native app. It won't automatically redirect to the web site when running inside the app.</p>
      <p>If you want to open the site in a browser, click the button below.</p>
      <a class="button" id="open-site" href="https://tryweeve.com">Open website</a>
    </div>
    <script>
        // Defensive stub: ensure `window.Capacitor` exists to avoid uncaught errors
        // when the native layer calls `triggerEvent` before the bridge is injected.
        // Only create a noop stub if Capacitor isn't already present.
        if (typeof window !== 'undefined' && !window.Capacitor) {
          // Minimal stub matching methods the app/native bridge expects.
          // Real Capacitor will overwrite this when the bridge is injected.
          // Keep functions synchronous and non-throwing.
          window.Capacitor = {
            isNativePlatform: () => false,
            getPlatform: () => 'web',
            triggerEvent: () => false,
            Platforms: {},
            __isStub: true,
          };
        }

      // If the page is opened in a normal browser and not in the Capacitor WebView, redirect to the site.
      // When running in the native app's WebView, don't auto-redirect so the user stays inside the app.
      const isCapacitor = !!(window.Capacitor || window.__capacitor__);
      const isAndroidWebView = /wv/.test(navigator.userAgent) || /Android.*AppleWebKit/.test(navigator.userAgent);
      if (!isCapacitor && !isAndroidWebView) {
        window.location.replace('https://tryweeve.com');
      }
    </script>
  </body>
</html>
